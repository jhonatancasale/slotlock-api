name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: slotlock_test
          POSTGRES_USER: slotlock
          POSTGRES_PASSWORD: slotlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotlock -d slotlock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://slotlock:slotlock@127.0.0.1:5432/slotlock_test
      TEST_DATABASE_URL: postgresql+asyncpg://slotlock:slotlock@127.0.0.1:5432/slotlock_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==2.4.3

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run task lint

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Check migration drift
        run: poetry run alembic check

      - name: Test
        run: poetry run task test
